<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Book Cover -->
  <rect x="40" y="30" width="120" height="140" fill="#8B4513" stroke="#000" stroke-width="5" rx="10" />
  <!-- Pages -->
  <rect x="50" y="40" width="100" height="120" fill="#FFF8DC" />
  <!-- Scribbles -->
  <line x1="60" y1="60" x2="140" y2="60" stroke="#000" stroke-width="2" />
  <line x1="60" y1="80" x2="140" y2="80" stroke="#000" stroke-width="2" />
  <line x1="60" y1="100" x2="110" y2="100" stroke="#000" stroke-width="2" />
  <!-- Wreck/Fire/Tear graphic -->
  <path d="M 70 120 L 100 150 L 130 120 L 100 180 Z" fill="red" stroke="orange" stroke-width="3" />
  <text x="100" y="145" font-family="Arial" font-size="20" font-weight="bold" fill="white" text-anchor="middle">RIP</text>
