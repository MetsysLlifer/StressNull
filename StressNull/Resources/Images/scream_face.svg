<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="100" cy="100" r="90" fill="#FFCC00" stroke="#000" stroke-width="5" />
  <!-- Eyes -->
  <circle cx="70" cy="70" r="20" fill="white" stroke="#000" stroke-width="3" />
  <circle cx="130" cy="70" r="20" fill="white" stroke="#000" stroke-width="3" />
  <!-- Pupils -->
  <circle cx="70" cy="70" r="5" fill="black" />
  <circle cx="130" cy="70" r="5" fill="black" />
  <!-- Screaming Mouth -->
  <ellipse cx="100" cy="140" rx="30" ry="40" fill="black" stroke="#000" stroke-width="3" />
  <ellipse cx="100" cy="140" rx="20" ry="30" fill="darkred" />
  <!-- Sweat drop -->
  <path d="M 160 50 Q 170 80 160 90 Q 150 80 160 50" fill="#00BFFF" />
</svg>